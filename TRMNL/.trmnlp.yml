---
# auto-reload when files change
watch:
  - src
  - .trmnlp.yml

# values of custom fields
custom_fields: {}
  # Add your custom fields here

# Time zone for development
time_zone: Europe/Warsaw

# override variables for development
variables:
  count: 7
  entities:
    - n: "Pokój"
      u: "°C"
      val: 20.5
      type: "sensor_1"
      device_class: "temperature"
    - n: "Sypialnia"
      u: "%"
      val: 49
      type: "sensor_2"
      device_class: "humidity"
    - n: "Outdoor"
      u: "°C"
      val: 22.5
      type: "sensor_3"
      device_class: "temperature"
    - n: "Outdoor"
      u: "%"
      val: 45
      type: "sensor_4"
      device_class: "humidity"
    - i: "mdi:temperature-celsius"
      n: "Dewpoint"
      u: "°C"
      val: 14.6
      type: "sensor_5"
      device_class: "temperature"
    - i: "mdi:flower-pollen"
      n: "Grass Pollen"
      val: 2
      type: "sensor_6"
  co2_value: 820
  weather_code: "partlycloudy"
  timestamp: "2025-06-14T10:14:25.085591"
  trmnl:
    plugin_settings:
      instance_name: "Home Assistant Sensors"
      strategy: "webhook"
      dark_mode: "no"
      polling_headers: ""
      polling_url: ""
